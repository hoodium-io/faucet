server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression for the JS/CSS bundle.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Baseline security headers.
    #
    # CSP notes:
    #  - `script-src` must allow the CAPTCHA providers, because the widget loads
    #    an external script. Both domains are listed so either provider works
    #    without an nginx edit; remove one if you standardise on the other.
    #  - `frame-src` is required because both Turnstile and reCAPTCHA render in
    #    an iframe.
    #  - `connect-src` allows the app's own API plus the CAPTCHA verification
    #    calls made from the browser by the provider's script.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com https://www.google.com; frame-src https://challenges.cloudflare.com https://www.google.com; frame-ancestors 'none'; base-uri 'self'" always;

    # Proxy API calls to the backend container. Keeping the browser on a single
    # origin means no CORS preflight and no CORS misconfiguration in production.
    location /api/ {
        proxy_pass http://backend-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The backend reads X-Forwarded-For for the per-IP budget, so this header
        # must be set or every user would share the proxy's IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed assets are immutable; cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
